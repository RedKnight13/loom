# First consumer: the remembrance engine.
repo      = "RedKnight13/smriti"
# smriti's suites are designed to run one per process (shared SMRITI_HOME
# fixtures and a module named `run` collide in a single process); this is the
# repo's own convention (see EPOCH-2.3-REPORT.md and .github/workflows/test.yml).
# Stdlib only: no pytest required. Every file runs; the exit is 1 if any failed.
checks    = "rc=0; for t in tests/test_*.py; do echo \"== $t\"; python3 \"$t\" || { echo \"!! FAILED $t\"; rc=1; }; done; exit $rc"
worktrees = "~/Work/claude-code/smriti-worktrees"
limit_min = 45
# Owner, 2026-11-07: workers "only start or stop throuhgh orcacli".
executor  = "orca"
# Owner, 2026-11-07: compute runs on Agni, never the conductor's laptop.
# First reachable host wins; none reachable = refuse (never run here).
compute   = ["agni1", "agni2"]
# The optional fast Ed25519 backend (smriti's `fast` extra) lives in this venv
# on each compute host; a host without it fails loudly as "could not run".
compute_setup = ". ~/.venvs/smriti-checks/bin/activate"
laws = [
  "Workers never push; only the conductor pushes, reviews and merges, under the owner's GitHub name.",
  "Nothing identifying the owner enters any file, log, or commit.",
  "GPU compute on agni2 only; no paid API credits spent by a worker.",
  "Captured exit codes only; a check that was not run is reported as not run.",
]
