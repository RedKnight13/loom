# Loom as its own consumer: Loom's own development tickets live here as issues.
# The conductor writes and merges; workers only produce branches in their
# worktrees and never push.
repo      = "RedKnight13/loom"
checks    = "bash ops/selftest.sh && shellcheck -x ops/*.sh ops/loom"
worktrees = "~/work/loom-workdirs"
limit_min = 45                           # generous enough for one honest turn
workers   = 2                            # max open assignments; loom capacity suggested 2
executor  = "auto"                       # Orca when ready, else the local launcher
start_timeout_ms = 300000                # codex on a remote Orca host is slow to be ready (#52)

laws = [
  "Workers never push; only the conductor pushes, reviews and merges, under the owner's GitHub name.",
  "Do not add personal paths, machine names, session IDs, or private notes to new content. Existing copyright, author and licence attribution stays.",
  "Never guess a decision that belongs to the owner: end the turn blocked with one concrete question.",
  "Captured exit codes only; a check that was not run is reported as not run.",
]
