name: gates

# Every change runs on standard GitHub-hosted Ubuntu and macOS runners.
# Owner branches also run on agni2 and the Mac. Fork and Dependabot PRs
# never execute on self-hosted runners.
#
# The macOS job is the one that catches Darwin-only harness assumptions: BSD
# sed's inserted-line rule and TMPDIR living under the /var symlink.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted:
    name: gates (self-hosted ${{ matrix.label }})
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    strategy:
      fail-fast: false
      matrix:
        label: [agni2, mac]
    runs-on: [self-hosted, "${{ matrix.label }}"]
    steps:
      - uses: actions/checkout@v7

      # A launchagents-managed runner starts with /usr/bin:/bin only.
      - name: Homebrew on PATH
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          missing=''
          command -v jq >/dev/null 2>&1 || missing="$missing jq"
          command -v shellcheck >/dev/null 2>&1 || missing="$missing shellcheck"
          if [[ -n $missing ]]; then
            if [[ ${RUNNER_OS:-} == macOS ]]; then
              brew install $missing
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq $missing
            fi
          fi
          bash --version | head -1
          jq --version
          shellcheck --version | head -2

      - name: selftest
        run: bash ops/selftest.sh

      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom

      - name: Native runtime regressions
        if: runner.os == 'Linux'
        run: |
          bash tests/review/review-check-start.sh
          bash tests/review/review-native.sh
          bash tests/review/review-mail.sh

  hosted:
    name: gates (hosted ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # A launchagents-managed runner starts with /usr/bin:/bin only.
      - name: Homebrew on PATH
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          missing=''
          command -v jq >/dev/null 2>&1 || missing="$missing jq"
          command -v shellcheck >/dev/null 2>&1 || missing="$missing shellcheck"
          if [[ -n $missing ]]; then
            if [[ ${RUNNER_OS:-} == macOS ]]; then
              brew install $missing
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq $missing
            fi
          fi

      - name: selftest
        run: bash ops/selftest.sh

      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom

      - name: Native runtime regressions
        if: runner.os == 'Linux'
        run: |
          bash tests/review/review-check-start.sh
          bash tests/review/review-native.sh
          bash tests/review/review-mail.sh

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [self-hosted, hosted]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all applicable runner matrices passed
        env:
          OWNER_RESULT: ${{ needs.self-hosted.result }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
        run: |
          if [[ "$HOSTED_RESULT" == success ]] &&
             [[ "$OWNER_RESULT" == success || "$OWNER_RESULT" == skipped ]]; then
            exit 0
          fi
          echo "CI did not pass: owner=$OWNER_RESULT hosted=$HOSTED_RESULT"
          exit 1
