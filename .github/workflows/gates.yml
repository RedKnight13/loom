name: gates

# Portable gates on both platforms. The 2026-11-08 macOS failures -- BSD sed
# joining an inserted line, and TMPDIR living under the /var symlink -- were
# both test-harness assumptions that only a macOS run can catch.
#
# The self-hosted job is dispatch-only on purpose: this repository is public,
# and a runner that executes arbitrary pull-request code on a personal machine
# is not a gate, it is an invitation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: Also run the gates on the self-hosted runner (label agni)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          missing=''
          command -v jq >/dev/null 2>&1 || missing="$missing jq"
          command -v shellcheck >/dev/null 2>&1 || missing="$missing shellcheck"
          if [[ -n $missing ]]; then
            if [[ ${RUNNER_OS:-} == macOS ]]; then
              brew install $missing
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq $missing
            fi
          fi
          bash --version | head -1
          jq --version
          shellcheck --version | head -2

      - name: selftest
        run: bash ops/selftest.sh

      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom

  agni:
    name: gates (self-hosted agni)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted == true }}
    runs-on: [self-hosted, agni]
    steps:
      - uses: actions/checkout@v4
      - name: selftest
        run: bash ops/selftest.sh
      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom
