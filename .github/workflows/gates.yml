name: gates

# Own branches run on the owner's machines (agni2 and this Mac); fork pull
# requests and Dependabot updates run on GitHub-hosted runners. A public repository must never execute
# untrusted pull-request code on a self-hosted runner.
#
# The macOS job is the one that catches Darwin-only harness assumptions: BSD
# sed's inserted-line rule and TMPDIR living under the /var symlink.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted:
    name: gates (self-hosted ${{ matrix.label }})
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    strategy:
      fail-fast: false
      matrix:
        label: [agni2, mac]
    runs-on: [self-hosted, "${{ matrix.label }}"]
    steps:
      - uses: actions/checkout@v7

      # A launchagents-managed runner starts with /usr/bin:/bin only.
      - name: Homebrew on PATH
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          missing=''
          command -v jq >/dev/null 2>&1 || missing="$missing jq"
          command -v shellcheck >/dev/null 2>&1 || missing="$missing shellcheck"
          if [[ -n $missing ]]; then
            if [[ ${RUNNER_OS:-} == macOS ]]; then
              brew install $missing
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq $missing
            fi
          fi
          bash --version | head -1
          jq --version
          shellcheck --version | head -2

      - name: selftest
        run: bash ops/selftest.sh

      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom

  fork:
    name: gates (hosted ${{ matrix.os }})
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # A launchagents-managed runner starts with /usr/bin:/bin only.
      - name: Homebrew on PATH
        if: runner.os == 'macOS'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          missing=''
          command -v jq >/dev/null 2>&1 || missing="$missing jq"
          command -v shellcheck >/dev/null 2>&1 || missing="$missing shellcheck"
          if [[ -n $missing ]]; then
            if [[ ${RUNNER_OS:-} == macOS ]]; then
              brew install $missing
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq $missing
            fi
          fi

      - name: selftest
        run: bash ops/selftest.sh

      - name: shellcheck
        run: shellcheck -x ops/*.sh ops/loom

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [self-hosted, fork]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the selected runner matrix passed
        env:
          OWNER_RESULT: ${{ needs.self-hosted.result }}
          HOSTED_RESULT: ${{ needs.fork.result }}
        run: |
          if [[ "$OWNER_RESULT" == success && "$HOSTED_RESULT" == skipped ]] ||
             [[ "$OWNER_RESULT" == skipped && "$HOSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "CI did not pass: owner=$OWNER_RESULT hosted=$HOSTED_RESULT"
          exit 1
